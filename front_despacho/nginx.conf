server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ventas {
        proxy_pass http://back-ventas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/despachos {
        proxy_pass http://back-despachos:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /img-proxy/apple {
        proxy_pass https://seeklogo.com/images/A/apple-logo-E3DBF3AE34-seeklogo.com.png;
        proxy_set_header Referer "";
    }

    location /img-proxy/hyperx {
        proxy_pass https://seeklogo.com/images/H/hyper-x-logo-C4B6774A38-seeklogo.com.png;
        proxy_set_header Referer "";
    }

    location /img-proxy/logitech {
        proxy_pass https://seeklogo.com/images/L/logitech-gaming-logo-B76FC713B0-seeklogo.com.png;
        proxy_set_header Referer "";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
