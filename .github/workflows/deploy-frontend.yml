name: Despliegue de Capa de Frontend

on:
  push:
    branches: [ "deploy" ]
    paths:
      - "front_despacho/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: cluster-proyecto-ep3

jobs:
  build-push-deploy:
    name: Construir, Subir y Desplegar Frontend en EKS
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Configurar Credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Iniciar Sesión en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Construir y Subir Imagen
      run: |
        REGISTRY=${{ steps.login-ecr.outputs.registry }}
        docker build -t $REGISTRY/ep3-frontend:latest ./front_despacho
        docker push $REGISTRY/ep3-frontend:latest

    - name: Configurar Acceso a EKS
      run: |
        aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Desplegar en EKS (Rollout Restart)
      run: |
        kubectl rollout restart deployment/front-despacho
